<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="subject" content="Reset Password" />
    <title>Reset Password</title>
</head>

<body>
    <h1>Hello, {{.username}}</h1>
    <p>You have got a permission to reset the forgotten password. Please click on the button below to confirm the action and navigate to the page for setting new password.</p>
    <small>the session will be expired in 1 hour</small>
    <form method="post" action="{{.link}}">
        <input type="hidden" name="email" value="{{.email}}" />
        <input type="hidden" name="token" value="{{.token}}" />
        <input type="hidden" name="locale" value="{{.locale}}" />
        <button type="submit">Reset Password</button>
    </form>
    <p>Regards,<br />Clothes Advisor administration</p>
</body>

</html>
